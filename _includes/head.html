<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% seo %}

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300..800&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/dist/vis-network.min.css"
        type="text/css" />
    <link rel="stylesheet" href="{{ ' /assets/main.css?v1.4.9' | relative_url }}" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    <title>{{ page.title | default: "Web of Origins" }}</title>
    
    <link rel="icon" type="image/x-icon" href="{{ "/src/Assets/favicon.ico" | relative_url }}">
    <link rel="icon" type="image/svg+xml" href="{{ "/src/Assets/favicon_light.svg" | relative_url }}" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/svg+xml" href="{{ "/src/Assets/favicon_dark.svg" | relative_url }}" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="{{ "/src/Assets/favicon_default.png" | relative_url }}">

    <link rel="canonical" href="https://weboforigins.com{{ page.url }}">

    <link rel="preconnect" href="https://challenges.cloudflare.com">
